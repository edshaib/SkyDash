plugins { id 'net.fabricmc.fabric-loom' version '1.19.3' }
version = '0.1.1'
group = 'dev.skydash'
base { archivesName = 'skydash' }
repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }
loom { splitEnvironmentSourceSets(); mods { skydash { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
dependencies {
 minecraft 'com.mojang:minecraft:26.1.2'
 implementation 'net.fabricmc:fabric-loader:0.20.1'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
 implementation 'com.terraformersmc:modmenu:18.0.2'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.register('coreTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.skydash.api.CoreTests'; enableAssertions = true }
check.dependsOn coreTest

// Tests use a plain Java harness; no additional testing dependency.
tasks.named('test') { enabled = false; dependsOn coreTest }
